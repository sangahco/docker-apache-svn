<Location /svn>
#       AuthBasicAuthoritative Off # http://httpd.apache.org/docs/2.2/mod/mod_auth_basic.html

        DAV svn
        SVNParentPath "/mnt/svn/"
        #SVNListParentPath on
        SVNAllowBulkUpdates Off
        #AuthzSVNAccessFile "/mnt/acl.svn"

        AuthName "Subversion Repository"
        AuthType Basic
        AuthUserFile "/etc/apache2/.htaccess"
        AuthzSVNAccessFile "/etc/apache2/.svnaccess"

        require valid-user
</Location>

TimeOut 240

<IfModule mpm_worker_module>
    ServerLimit              4
    StartServers             2
    MinSpareThreads         25
    MaxSpareThreads         75
    ThreadLimit             64
    ThreadsPerChild         16
    MaxRequestWorkers       64
    MaxConnectionsPerChild  5000
</IfModule>

<IfModule dav_svn_module>
    SVNInMemoryCacheSize 1048576
    SVNCacheTextDeltas On
    SVNCacheFullTexts On
</IfModule>


